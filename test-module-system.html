<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Module System Test</title>
</head>
<body>
    <h1>Module System Test</h1>
    <div id="status">Testing modules...</div>
    
    <script type="module">
        // Test all the main modules
        try {
            console.log('Testing module imports...');
            
            // Test UUID library
            const { UUIDGenerator } = await import('./js/lib/uuid.js');
            console.log('✅ UUID library loaded');
            
            // Test user management
            const { UserManager, AuthManager, PermissionMiddleware, USER_ROLES } = await import('./js/features/users/index.js');
            console.log('✅ User management loaded');
            
            // Test pet management
            const { PetManager, PET_STATUS, PET_TYPES } = await import('./js/features/pets/pet_manager.js');
            console.log('✅ Pet manager loaded');
            
            const { PetUI } = await import('./js/features/pets/pet_ui.js');
            console.log('✅ Pet UI loaded');
            
            // Test check-in management
            const { CheckInManager } = await import('./js/features/checkin/checkin_manager.js');
            console.log('✅ Check-in manager loaded');
            
            const { CheckInUI } = await import('./js/features/checkin/checkin_ui.js');
            console.log('✅ Check-in UI loaded');
            
            // Test storage
            const { StorageManager } = await import('./js/lib/storage.js');
            console.log('✅ Storage manager loaded');
            
            // Test config
            const { getConfig, config } = await import('./js/config.js');
            console.log('✅ Config loaded');
            
            // Test main app
            const { app, MultiUserApp } = await import('./js/app.js');
            console.log('✅ Main app loaded');
            
            document.getElementById('status').innerHTML = `
                <h2>✅ All modules loaded successfully!</h2>
                <p>Module system is working correctly.</p>
                <ul>
                    <li>UUID Generator: ${UUIDGenerator ? '✅' : '❌'}</li>
                    <li>User Management: ${UserManager ? '✅' : '❌'}</li>
                    <li>Pet Management: ${PetManager ? '✅' : '❌'}</li>
                    <li>Check-in Management: ${CheckInManager ? '✅' : '❌'}</li>
                    <li>Storage Manager: ${StorageManager ? '✅' : '❌'}</li>
                    <li>Config: ${getConfig && config ? '✅' : '❌'}</li>
                    <li>Main App: ${MultiUserApp ? '✅' : '❌'}</li>
                </ul>
                <p><strong>USER_ROLES:</strong> ${Object.keys(USER_ROLES).join(', ')}</p>
                <p><strong>PET_STATUS:</strong> ${Object.values(PET_STATUS).join(', ')}</p>
                <p><strong>PET_TYPES:</strong> ${Object.values(PET_TYPES).join(', ')}</p>
                <p><strong>Firebase Config:</strong> ${config.firebase ? '✅ Available' : '❌ Missing'}</p>
            `;
            
        } catch (error) {
            console.error('❌ Module test failed:', error);
            document.getElementById('status').innerHTML = `
                <h2>❌ Module test failed!</h2>
                <p><strong>Error:</strong> ${error.message}</p>
                <pre>${error.stack}</pre>
            `;
        }
    </script>
</body>
</html>
