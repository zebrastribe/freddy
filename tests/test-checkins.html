<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
        button { margin: 5px; padding: 10px 15px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h1>Check-in Test Page</h1>
    
    <div>
        <button onclick="testCurrentPetInfo()">Test Current Pet Info</button>
        <button onclick="testLoadCheckIns()">Test Load Check-ins</button>
        <button onclick="testPetSpecificCheckIns()">Test Pet-Specific Check-ins</button>
        <button onclick="addTestCheckIn()">Add Test Check-in</button>
    </div>
    
    <div id="output"></div>
    
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js';
        import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js';
        import { getFirestore, collection, getDocs, query, where, orderBy, limit, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';
        
        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyBxGUOlJvH6KjAqTqX6JmJmJmJmJmJmJmJm",
            authDomain: "freddy-pet-tracker.firebaseapp.com",
            projectId: "freddy-pet-tracker",
            storageBucket: "freddy-pet-tracker.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Sign in anonymously
        await signInAnonymously(auth);
        
        window.firebaseApp = app;
        window.firebaseDB = db;
        window.firebaseAuth = auth;
        
        function log(message, type = 'info') {
            const output = document.getElementById('output');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            output.appendChild(div);
        }
        
        window.testCurrentPetInfo = function() {
            log('Testing current pet info...', 'info');
            
            if (window.currentPetInfo) {
                log(`✅ Current pet info found:<br>
                    User ID: ${window.currentPetInfo.userId}<br>
                    Pet Name: ${window.currentPetInfo.petName}<br>
                    Pet UUID: ${window.currentPetInfo.petUUID}<br>
                    Pet Index: ${window.currentPetInfo.petIndex}`, 'success');
            } else {
                log('❌ No current pet info found. Make sure you are on a pet page like /uid123/freddy/', 'error');
            }
        };
        
        window.testLoadCheckIns = async function() {
            log('Testing load check-ins...', 'info');
            
            try {
                const checkinsQuery = query(
                    collection(db, 'clicks'),
                    orderBy('timestamp', 'desc'),
                    limit(10)
                );
                
                const snapshot = await getDocs(checkinsQuery);
                const checkins = [];
                
                snapshot.forEach(doc => {
                    checkins.push({ id: doc.id, ...doc.data() });
                });
                
                log(`✅ Found ${checkins.length} total check-ins:`, 'success');
                
                // Display check-ins in a table
                let tableHtml = `
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Pet ID</th>
                                <th>Location</th>
                                <th>Timestamp</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                checkins.forEach(checkin => {
                    const timestamp = checkin.timestamp?.toDate ? checkin.timestamp.toDate() : new Date(checkin.timestamp);
                    tableHtml += `
                        <tr>
                            <td>${checkin.id}</td>
                            <td>${checkin.name || 'N/A'}</td>
                            <td>${checkin.petId || 'N/A'}</td>
                            <td>${checkin.latitude?.toFixed(6)}, ${checkin.longitude?.toFixed(6)}</td>
                            <td>${timestamp.toLocaleString()}</td>
                        </tr>
                    `;
                });
                
                tableHtml += '</tbody></table>';
                log(tableHtml, 'info');
                
            } catch (error) {
                log(`❌ Error loading check-ins: ${error.message}`, 'error');
            }
        };
        
        window.testPetSpecificCheckIns = async function() {
            log('Testing pet-specific check-ins...', 'info');
            
            if (!window.currentPetInfo || !window.currentPetInfo.petUUID) {
                log('❌ No current pet info found. Please navigate to a pet page first.', 'error');
                return;
            }
            
            const petUUID = window.currentPetInfo.petUUID;
            log(`Looking for check-ins with petId: ${petUUID}`, 'info');
            
            try {
                const checkinsQuery = query(
                    collection(db, 'clicks'),
                    where('petId', '==', petUUID),
                    orderBy('timestamp', 'desc'),
                    limit(20)
                );
                
                const snapshot = await getDocs(checkinsQuery);
                const checkins = [];
                
                snapshot.forEach(doc => {
                    checkins.push({ id: doc.id, ...doc.data() });
                });
                
                log(`✅ Found ${checkins.length} check-ins for pet ${petUUID}:`, 'success');
                
                if (checkins.length === 0) {
                    log('No check-ins found for this pet. This might be why the "Freddys trail" tab shows no data.', 'info');
                } else {
                    // Display check-ins in a table
                    let tableHtml = `
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Location</th>
                                    <th>Timestamp</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;
                    
                    checkins.forEach(checkin => {
                        const timestamp = checkin.timestamp?.toDate ? checkin.timestamp.toDate() : new Date(checkin.timestamp);
                        tableHtml += `
                            <tr>
                                <td>${checkin.id}</td>
                                <td>${checkin.name || 'N/A'}</td>
                                <td>${checkin.latitude?.toFixed(6)}, ${checkin.longitude?.toFixed(6)}</td>
                                <td>${timestamp.toLocaleString()}</td>
                            </tr>
                        `;
                    });
                    
                    tableHtml += '</tbody></table>';
                    log(tableHtml, 'info');
                }
                
            } catch (error) {
                log(`❌ Error loading pet-specific check-ins: ${error.message}`, 'error');
            }
        };
        
        window.addTestCheckIn = async function() {
            log('Adding test check-in...', 'info');
            
            if (!window.currentPetInfo || !window.currentPetInfo.petUUID) {
                log('❌ No current pet info found. Please navigate to a pet page first.', 'error');
                return;
            }
            
            const petUUID = window.currentPetInfo.petUUID;
            
            try {
                const checkinData = {
                    petId: petUUID,
                    name: 'Test Check-in',
                    latitude: 55.6761 + (Math.random() - 0.5) * 0.01, // Random location near Copenhagen
                    longitude: 12.5683 + (Math.random() - 0.5) * 0.01,
                    timestamp: serverTimestamp(),
                    userId: auth.currentUser?.uid || 'test-user'
                };
                
                const docRef = await addDoc(collection(db, 'clicks'), checkinData);
                log(`✅ Test check-in added with ID: ${docRef.id}`, 'success');
                
                // Test loading check-ins again
                setTimeout(() => {
                    window.testPetSpecificCheckIns();
                }, 1000);
                
            } catch (error) {
                log(`❌ Error adding test check-in: ${error.message}`, 'error');
            }
        };
        
        log('✅ Firebase initialized and ready for testing', 'success');
    </script>
</body>
</html>
