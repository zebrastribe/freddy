<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Freddy Admin</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 5px; margin: 10px 0; }
    .success { color: green; background: #e6ffe6; padding: 10px; border-radius: 5px; margin: 10px 0; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .instructions { background: #f0f0f0; padding: 15px; border-radius: 5px; margin: 20px 0; }
    #admin-controls { display: none; }
  </style>
  <script type="module">
    import { setFreddyStatus, getFreddyStatus } from './js/config.js';

    async function updateStatus(mode) {
      try {
        await setFreddyStatus(mode);
        document.getElementById('current-status').innerText = mode;
        document.getElementById('status-message').innerHTML = '<span class="success">Status updated to: ' + mode + '</span>';
      } catch (e) {
        document.getElementById('status-message').innerHTML = '<span class="error">Error updating status: ' + e.message + '</span>';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      let pw = prompt('Enter admin password:');
      if (pw !== 'AngryLion') {
        document.body.innerHTML = '<h2>Access denied.</h2>';
        return;
      }
      document.getElementById('admin-controls').style.display = '';
      try {
        const mode = await getFreddyStatus();
        document.getElementById('current-status').innerText = mode;
      } catch (e) {
        document.getElementById('current-status').innerText = 'Unknown';
        document.getElementById('status-message').innerHTML = '<span class="error">Could not fetch status: ' + e.message + '</span>';
      }
    });
    window.updateStatus = updateStatus;
  </script>
</head>
<body>
  <h1>Freddy Admin</h1>
  <div>Current status: <span id="current-status">...</span></div>
  <div id="status-message"></div>
  <div id="admin-controls">
    <button onclick="updateStatus('MISSING')">Set MISSING</button>
    <button onclick="updateStatus('OK')">Set FOUND/OK</button>
  </div>
</body>
</html>
