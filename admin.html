<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffcc00">
  <link rel="icon" type="image/png" href="img/emoji-cat-192x192.png">
  <link rel="manifest" href="manifest.json">
  <title>Freddy Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script type="module">
    import { setFreddyStatus, getFreddyStatus } from './js/config.js';
    import { collection, getDocs, query, orderBy, limit, deleteDoc, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
    import { db, requestFCMPermission, fcmToken } from './js/firebase-setup.js';

    let notificationPermission = false;
    let lastCheckInTime = null;
    let sessionToken = null;

    // Admin authentication function
    async function authenticateAdmin(password) {
      try {
        const response = await fetch('https://us-central1-tracker-6a648.cloudfunctions.net/verifyAdminPassword', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ password })
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.error || 'Authentication failed');
        }

        const data = await response.json();
        sessionToken = data.sessionToken;
        return true;
      } catch (error) {
        console.error('Authentication error:', error);
        return false;
      }
    }

    // Request notification permission
    async function requestNotificationPermission() {
      if (!('Notification' in window)) {
        console.log('This browser does not support notifications');
        return false;
      }

      if (Notification.permission === 'granted') {
        notificationPermission = true;
        return true;
      }

      if (Notification.permission === 'denied') {
        console.log('Notification permission denied');
        return false;
      }

      try {
        const permission = await Notification.requestPermission();
        notificationPermission = permission === 'granted';
        
        // If permission granted, also request FCM permission for push notifications
        if (notificationPermission) {
          await requestFCMPermission();
        }
        
        return notificationPermission;
      } catch (error) {
        console.error('Error requesting notification permission:', error);
        return false;
      }
    }

    // Show notification for new check-in
    function showCheckInNotification(checkIn) {
      if (!notificationPermission) return;

      const notification = new Notification('Ny Freddy Check-in! 🐱', {
        body: `${checkIn.name} har lige checket ind!`,
        icon: '/img/emoji-cat-192x192.png',
        badge: '/img/emoji-cat-192x192.png',
        tag: 'freddy-checkin-admin',
        requireInteraction: false,
        silent: false
      });

      // Auto-close after 5 seconds
      setTimeout(() => {
        notification.close();
      }, 5000);

      // Handle click on notification
      notification.onclick = function() {
        window.focus();
        notification.close();
      };
    }

    // Set up real-time listener for new check-ins
    function setupCheckInListener() {
      const q = query(collection(db, "clicks"), orderBy("timestamp", "desc"), limit(1));
      
      onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === "added") {
            const checkIn = change.doc.data();
            const checkInTime = checkIn.timestamp?.toDate?.() || new Date();
            
            // Only show notification if this is a new check-in (not from page load)
            if (lastCheckInTime && checkInTime > lastCheckInTime) {
              showCheckInNotification(checkIn);
            }
            
            lastCheckInTime = checkInTime;
          }
        });
      }, (error) => {
        console.error("Error listening to check-ins:", error);
      });
    }

    async function fetchCheckIns(limitCount = 50) {
      const q = query(collection(db, "clicks"), orderBy("timestamp", "desc"), limit(limitCount));
      const snapshot = await getDocs(q);
      return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    }

    function formatTimestamp(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts.seconds * 1000);
      return d.toLocaleString('da-DK');
    }

    async function renderCheckInTable() {
      const checkIns = await fetchCheckIns();
      let rows = checkIns.map(entry => `
        <tr class="hover:bg-gray-100 transition">
          <td class="px-4 py-2 text-center">
            <input type="checkbox" class="checkin-checkbox form-checkbox h-4 w-4 text-blue-600" value="${entry.id}">
          </td>
          <td class="px-4 py-2">${entry.name || ''}</td>
          <td class="px-4 py-2">${formatTimestamp(entry.timestamp)}</td>
          <td class="px-4 py-2">${entry.latitude ? entry.latitude.toFixed(5) : ''}, ${entry.longitude ? entry.longitude.toFixed(5) : ''}</td>
        </tr>
      `).join('');
      return `
        <div class="mt-8">
          <h2 class="text-lg font-bold mb-4">Seneste check-ins</h2>
          <div class="overflow-x-auto rounded-lg shadow bg-white">
            <form id="delete-form">
              <button type="submit" class="mb-4 px-5 py-2 bg-red-600 hover:bg-red-700 text-white font-semibold rounded-lg shadow transition disabled:opacity-50 disabled:cursor-not-allowed" id="delete-selected" disabled>Slet valgte</button>
              <div class="overflow-x-auto">
                <table class="min-w-full text-sm text-left border-separate border-spacing-y-1">
                  <thead class="sticky top-0 bg-gray-100 z-10">
                    <tr>
                      <th class="px-4 py-2 text-center"><input type="checkbox" id="check-all"></th>
                      <th class="px-4 py-2">Navn</th>
                      <th class="px-4 py-2">Tidspunkt</th>
                      <th class="px-4 py-2">Koordinater</th>
                    </tr>
                  </thead>
                  <tbody id="checkin-table-body">
                    ${rows}
                  </tbody>
                </table>
              </div>
            </form>
          </div>
        </div>
      `;
    }

    // Fetch and display admin notification link status
    async function updateNotificationStatus() {
      const statusDiv = document.getElementById('notification-status');
      try {
        // Call the Cloud Function to get notification status securely
        const response = await fetch('https://us-central1-tracker-6a648.cloudfunctions.net/getNotificationStatus', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        
        if (!data.linked) {
          // Update checkbox state
          const linkCheckbox = document.getElementById('link-this-device');
          if (linkCheckbox) {
            linkCheckbox.checked = false;
          }
          
          statusDiv.innerHTML = `<span class="text-red-600">${data.message}</span>
            <div class="text-sm text-blue-600 mt-2">Brug afkrydsningsboksen ovenfor for at linke denne enhed til notifikationer.</div>`;
          return;
        }

        // Get current device's token for comparison
        let currentToken = null;
        try {
          const { getToken } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js');
          const { getMessaging } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging.js');
          const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js');
          
          const app = initializeApp({
            apiKey: "AIzaSyBwLFO04OQgD6LjYdYlrEXb73THTp5H0Ss",
            authDomain: "tracker-6a648.firebaseapp.com",
            projectId: "tracker-6a648",
            storageBucket: "tracker-6a648.appspot.com",
            messagingSenderId: "789878332530",
            appId: "1:789878332530:web:9bd999d86df0fe9caef6eb",
            measurementId: "G-XMHHKFJ9QW"
          });
          
          const messaging = getMessaging(app);
          currentToken = await getToken(messaging, {
            vapidKey: 'BI4KzajvA8eJRZ8p3D-yRATNm0eDeS2hfToxP7LB6_9uTU0b3UjooAgdnJoqszasRw2qWxWFxmMN9WnZxK1EUiY'
          });
        } catch (tokenError) {
          console.log('Could not get current FCM token:', tokenError);
        }
        
        const linkedDevice = data.linkedDevice;
        const isThisDeviceLinked = currentToken && linkedDevice.token && currentToken === linkedDevice.token;
        
        // Update checkbox state
        const linkCheckbox = document.getElementById('link-this-device');
        if (linkCheckbox) {
          linkCheckbox.checked = isThisDeviceLinked;
        }
        
        statusDiv.innerHTML = `
          <div class="mb-2 ${isThisDeviceLinked ? 'text-green-700' : 'text-red-700'}">
            <strong>${isThisDeviceLinked ? '✅ Denne enhed er linket til notifikationer' : '❌ Denne enhed er IKKE linket til notifikationer'}</strong>
          </div>
          <div class="text-sm text-gray-600 mb-2">
            <strong>Linket enhed:</strong><br>
            <span class="font-mono text-xs">${linkedDevice.userAgent}</span><br>
            <strong>Linket den:</strong> ${linkedDevice.timestamp}
          </div>
          ${!isThisDeviceLinked ? '<div class="text-sm text-blue-600">Brug afkrydsningsboksen ovenfor for at linke denne enhed til notifikationer.</div>' : ''}
        `;
      } catch (error) {
        console.error('Error fetching notification status:', error);
        statusDiv.innerHTML = '<span class="text-red-600">Fejl ved hentning af notifikationsstatus: ' + error.message + '</span>';
      }
    }

    async function showAdminSection() {
      document.getElementById('login-section').classList.add('hidden');
      const adminSection = document.getElementById('admin-section');
      adminSection.classList.remove('hidden');
      adminSection.innerHTML = `
        <div id="status-message" class="mb-4"></div>
        <div class="mb-4">Nuværende status: <span id="current-status" class="font-bold">...</span></div>
        <div class="flex flex-col sm:flex-row gap-4 mb-4">
          <button id="set-missing" class="bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-2 px-4 rounded">Sæt som EFTERLYST</button>
          <button id="set-ok" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded">Sæt som FUNDET/OK</button>
        </div>
        <div class="flex items-center gap-2 mb-4">
          <button id="notification-toggle" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            ${notificationPermission ? '🔔 Notifikationer: TIL' : '🔕 Notifikationer: FRA'}
          </button>
          <span class="text-sm text-gray-600">Få besked når nogen checker ind</span>
        </div>
        <div class="flex items-center gap-2 mb-4">
          <input type="checkbox" id="link-this-device" class="form-checkbox h-5 w-5 text-blue-600">
          <label for="link-this-device" class="text-sm text-gray-700">Link denne enhed til admin-notifikationer</label>
        </div>
        <div id="notification-status" class="mb-4"></div>
        <button id="logout-btn" class="bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 px-4 rounded w-full mb-8">Log ud</button>
        <div id="checkin-table"></div>
      `;
      // Fetch and show status
      getFreddyStatus().then(mode => {
        document.getElementById('current-status').innerText = mode;
      }).catch(e => {
        document.getElementById('current-status').innerText = 'Ukendt';
        document.getElementById('status-message').innerHTML = '<span class="bg-red-100 text-red-700 px-3 py-2 rounded">Kunne ikke hente status: ' + e.message + '</span>';
      });
      // Show notification link status
      updateNotificationStatus();
      
      // Handle link this device checkbox
      document.getElementById('link-this-device').addEventListener('change', async function() {
        if (this.checked) {
          // User wants to link this device
          const granted = await requestNotificationPermission();
          if (granted) {
            // The FCM token will be saved automatically by the firebase-setup.js
            // Update status after a moment to allow Firestore write
            setTimeout(() => {
              updateNotificationStatus();
              this.checked = true; // Keep checkbox checked
            }, 1000);
          } else {
            // Permission denied, uncheck the checkbox
            this.checked = false;
            alert('Notifikationsadgang blev nægtet. Dette enhed kan ikke linkes til notifikationer.');
          }
        } else {
          // User wants to unlink this device
          if (confirm('Er du sikker på, at du vil fjerne linket til denne enhed?')) {
            // Clear the FCM token from Firestore
            try {
              const { doc, deleteDoc } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js');
              await deleteDoc(doc(db, 'fcm_tokens', 'admin'));
              updateNotificationStatus();
            } catch (error) {
              console.error('Error unlinking device:', error);
              alert('Fejl ved fjernelse af link: ' + error.message);
              this.checked = true; // Re-check if failed
            }
          } else {
            // User cancelled, re-check the checkbox
            this.checked = true;
          }
        }
      });
      // Button handlers
      document.getElementById('set-missing').onclick = async () => {
        try {
          await setFreddyStatus('MISSING');
          document.getElementById('current-status').innerText = 'MISSING';
          document.getElementById('status-message').innerHTML = '<span class="bg-green-100 text-green-700 px-3 py-2 rounded">Status opdateret til: EFTERLYST</span>';
        } catch (e) {
          document.getElementById('status-message').innerHTML = '<span class="bg-red-100 text-red-700 px-3 py-2 rounded">Fejl ved opdatering: ' + e.message + '</span>';
        }
      };
      document.getElementById('set-ok').onclick = async () => {
        try {
          await setFreddyStatus('OK');
          document.getElementById('current-status').innerText = 'OK';
          document.getElementById('status-message').innerHTML = '<span class="bg-green-100 text-green-700 px-3 py-2 rounded">Status opdateret til: OK</span>';
        } catch (e) {
          document.getElementById('status-message').innerHTML = '<span class="bg-red-100 text-red-700 px-3 py-2 rounded">Fejl ved opdatering: ' + e.message + '</span>';
        }
      };
      document.getElementById('notification-toggle').onclick = async () => {
        if (notificationPermission) {
          notificationPermission = false;
          document.getElementById('notification-toggle').innerHTML = '🔕 Notifikationer: FRA';
        } else {
          const granted = await requestNotificationPermission();
          if (granted) {
            document.getElementById('notification-toggle').innerHTML = '🔔 Notifikationer: TIL';
            // Update notification status after a moment to allow Firestore write
            setTimeout(updateNotificationStatus, 1000);
          }
        }
      };
      document.getElementById('logout-btn').onclick = () => {
        sessionToken = null;
        localStorage.removeItem('freddyAdminSession');
        location.reload();
      };
      // Render check-in table
      const tableHtml = await renderCheckInTable();
      document.getElementById('checkin-table').innerHTML = tableHtml;
      // Helper to update delete button state
      function updateDeleteButton() {
        const checked = document.querySelectorAll('.checkin-checkbox:checked').length;
        document.getElementById('delete-selected').disabled = checked === 0;
      }
      // Select all logic
      document.getElementById('check-all').addEventListener('change', function() {
        document.querySelectorAll('.checkin-checkbox').forEach(cb => cb.checked = this.checked);
        updateDeleteButton();
      });
      // Enable/disable delete button on checkbox change
      document.querySelectorAll('.checkin-checkbox').forEach(cb => {
        cb.addEventListener('change', updateDeleteButton);
      });
      // Delete selected
      document.getElementById('delete-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        const checked = Array.from(document.querySelectorAll('.checkin-checkbox:checked')).map(cb => cb.value);
        if (checked.length === 0) return;
        if (!confirm('Slet valgte check-ins?')) return;
        for (const id of checked) {
          await deleteDoc(doc(db, 'clicks', id));
        }
        // Refresh table
        document.getElementById('checkin-table').innerHTML = await renderCheckInTable();
        // Re-attach listeners after refresh
        document.getElementById('check-all').addEventListener('change', function() {
          document.querySelectorAll('.checkin-checkbox').forEach(cb => cb.checked = this.checked);
          updateDeleteButton();
        });
        document.querySelectorAll('.checkin-checkbox').forEach(cb => {
          cb.addEventListener('change', updateDeleteButton);
        });
        updateDeleteButton();
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // Request notification permission and set up listeners
      await requestNotificationPermission();
      setupCheckInListener();

      // Check for existing session
      const savedSession = localStorage.getItem('freddyAdminSession');
      if (savedSession) {
        try {
          const sessionData = JSON.parse(savedSession);
          // Check if session is still valid (24 hours)
          if (Date.now() - sessionData.timestamp < 24 * 60 * 60 * 1000) {
            sessionToken = sessionData.token;
            showAdminSection();
            return;
          }
        } catch (e) {
          console.log('Invalid saved session');
        }
      }

      document.getElementById('login-btn').onclick = async function() {
        const password = document.getElementById('admin-password').value;
        const errorElement = document.getElementById('login-error');
        
        if (!password) {
          errorElement.innerText = 'Indtast venligst adgangskode';
          return;
        }

        errorElement.innerText = 'Logger ind...';
        
        const success = await authenticateAdmin(password);
        
        if (success) {
          // Save session
          localStorage.setItem('freddyAdminSession', JSON.stringify({
            token: sessionToken,
            timestamp: Date.now()
          }));
          showAdminSection();
        } else {
          errorElement.innerText = 'Forkert adgangskode';
        }
      };
      
      document.getElementById('admin-password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          document.getElementById('login-btn').click();
        }
      });
    });
  </script>
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="md:flex md:items-center md:justify-center md:min-h-screen px-0 md:px-2">
    <div class="w-full max-w-full md:max-w-4xl bg-white rounded-none md:rounded-2xl shadow-2xl p-2 md:p-8">
      <h1 class="text-xl md:text-2xl font-bold mb-8 text-center">Freddy Admin</h1>
      <div id="login-section">
        <input id="admin-password" type="password" placeholder="Adgangskode" class="border rounded px-4 py-4 w-full mb-4 text-lg" autocomplete="current-password">
        <button id="login-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded w-full mb-4 text-lg">Log ind</button>
        <div id="login-error" class="text-red-600 text-base mb-2"></div>
      </div>
      <div id="admin-section" class="hidden mt-8"></div>
    </div>
  </div>
</body>
</html>
