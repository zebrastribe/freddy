<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Freddy Admin</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .error { color: red; background: #ffe6e6; padding: 10px; border-radius: 5px; margin: 10px 0; }
    .success { color: green; background: #e6ffe6; padding: 10px; border-radius: 5px; margin: 10px 0; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
    .instructions { background: #f0f0f0; padding: 15px; border-radius: 5px; margin: 20px 0; }
    #admin-section { display: none; }
  </style>
  <script type="module">
    import { setFreddyStatus, getFreddyStatus } from './js/config.js';

    function showAdminSection() {
      document.getElementById('login-section').style.display = 'none';
      const adminSection = document.getElementById('admin-section');
      adminSection.style.display = '';
      adminSection.innerHTML = `
        <div id="status-message"></div>
        <div>Current status: <span id="current-status">...</span></div>
        <div style="margin-top: 10px;">
          <button id="set-missing">Set MISSING</button>
          <button id="set-ok">Set FOUND/OK</button>
        </div>
      `;
      // Fetch and show status
      getFreddyStatus().then(mode => {
        document.getElementById('current-status').innerText = mode;
      }).catch(e => {
        document.getElementById('current-status').innerText = 'Unknown';
        document.getElementById('status-message').innerHTML = '<span class="error">Could not fetch status: ' + e.message + '</span>';
      });
      // Button handlers
      document.getElementById('set-missing').onclick = async () => {
        try {
          await setFreddyStatus('MISSING');
          document.getElementById('current-status').innerText = 'MISSING';
          document.getElementById('status-message').innerHTML = '<span class="success">Status updated to: MISSING</span>';
        } catch (e) {
          document.getElementById('status-message').innerHTML = '<span class="error">Error updating status: ' + e.message + '</span>';
        }
      };
      document.getElementById('set-ok').onclick = async () => {
        try {
          await setFreddyStatus('OK');
          document.getElementById('current-status').innerText = 'OK';
          document.getElementById('status-message').innerHTML = '<span class="success">Status updated to: OK</span>';
        } catch (e) {
          document.getElementById('status-message').innerHTML = '<span class="error">Error updating status: ' + e.message + '</span>';
        }
      };
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('login-btn').onclick = function() {
        const pw = document.getElementById('admin-password').value;
        if (pw === 'AngryLion') {
          showAdminSection();
        } else {
          document.getElementById('login-error').innerText = 'Wrong password';
        }
      };
      document.getElementById('admin-password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          document.getElementById('login-btn').click();
        }
      });
    });
  </script>
</head>
<body>
  <h1>Freddy Admin</h1>
  <div id="login-section">
    <input type="password" id="admin-password" placeholder="Enter admin password" autofocus />
    <button id="login-btn">Login</button>
    <div id="login-error" style="color:red;"></div>
  </div>
  <div id="admin-section"></div>
</body>
</html>
