<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trace Admin - Multi-Pet Management</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="/css/tailwind.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center py-4">
          <div class="font-bold text-xl text-blue-700 text-left w-full pl-2">Admin</div>
          <div class="hidden" id="userInfo">
            <div class="flex items-center space-x-4 text-sm text-gray-600">
              <span id="userEmail"></span>
              <span id="userRole"></span>
              <button id="logoutBtn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">Logout</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Layout -->
    <div class="flex flex-1 min-h-0">
      <!-- Sidebar -->
      <aside class="hidden md:flex flex-col bg-white border-r border-gray-200 w-64 py-8 px-4 min-h-full">
        <nav class="flex flex-col gap-2">
          <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium transition-colors duration-200 bg-blue-600 text-white" data-section="overview">📊 Overview</button>
          <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="pets">🐾 Pet Management</button>
          <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="users">👥 User Management</button>
          <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="notifications">🔔 Notifications</button>
          <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="system">⚙️ System</button>
          <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="profile">👤 Profile</button>
        </nav>
      </aside>
      <!-- Mobile Sidebar Toggle -->
      <div class="md:hidden flex flex-col w-full">
        <div class="flex items-center justify-between bg-white border-b border-gray-200 px-4 py-3">
          <span class="font-bold text-lg">Admin Panel</span>
          <button id="mobileMenuBtn" class="text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 md:hidden">
            <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
        <aside id="sidebar" class="hidden flex-col bg-white border-r border-gray-200 w-full py-4 px-2">
          <nav class="flex flex-col gap-2">
            <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium transition-colors duration-200 bg-blue-600 text-white" data-section="overview">📊 Overview</button>
            <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="pets">🐾 Pet Management</button>
            <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="users">👥 User Management</button>
            <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="notifications">🔔 Notifications</button>
            <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="system">⚙️ System</button>
            <button class="nav-item w-full text-left px-4 py-3 rounded-lg font-medium text-gray-700 hover:bg-gray-100 transition-colors duration-200" data-section="profile">👤 Profile</button>
          </nav>
        </aside>
      </div>
      <!-- Main Content Area -->
      <main class="flex-1 p-8 overflow-y-auto">
        <!-- Auth Section -->
        <section id="authSection" class="hidden"></section>
        
        <!-- Dashboard Section -->
        <div id="adminDashboard" class="hidden"></div>
        
        <!-- Overview Section -->
        <section id="overviewSection" class="hidden">
          <div class="max-w-7xl mx-auto">
            <h2 class="text-3xl font-bold text-gray-900 mb-8">System Overview</h2>
            <div id="overviewContent">
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8" id="statsGrid">
                    <!-- Stats cards will be rendered here -->
                </div>
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">Recent Activity</h3>
                    <div id="recentActivity" class="space-y-3">
                        <!-- Activity items will be rendered here -->
                    </div>
                </div>
            </div>
          </div>
        </section>
        
        <!-- Pet Management Section -->
        <section id="petsSection" class="hidden">
          <div class="max-w-7xl mx-auto">
            <h2 class="text-3xl font-bold text-gray-900 mb-8">Pet Management</h2>
            <div id="petsContent">
              <!-- Pet management content will be loaded here -->
            </div>
          </div>
        </section>
        
        <!-- User Management Section -->
        <section id="usersSection" class="hidden">
          <div class="max-w-7xl mx-auto">
            <h2 class="text-3xl font-bold text-gray-900 mb-8">User Management</h2>
            <div id="usersContent">
              <!-- User management content will be loaded here -->
            </div>
          </div>
        </section>
        
        <!-- Notifications Section -->
        <section id="notificationsSection" class="hidden">
          <div class="max-w-7xl mx-auto">
            <h2 class="text-3xl font-bold text-gray-900 mb-8">Notifications</h2>
            <div id="notificationsContent">
              <!-- Notifications content will be loaded here -->
            </div>
          </div>
        </section>
        
        <!-- System Section -->
        <section id="systemSection" class="hidden">
          <div class="max-w-7xl mx-auto">
            <h2 class="text-3xl font-bold text-gray-900 mb-8">System</h2>
            <!-- System Controls -->
            <div class="flex flex-wrap gap-2 mb-6">
              <button id="exportDataBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Export Data</button>
              <button id="importDataBtn" class="px-4 py-2 bg-green-600 text-white rounded hover:bg-green-700 transition">Import Data</button>
              <button id="backupDataBtn" class="px-4 py-2 bg-indigo-600 text-white rounded hover:bg-indigo-700 transition">Backup Data</button>
              <button id="clearCacheBtn" class="px-4 py-2 bg-yellow-500 text-white rounded hover:bg-yellow-600 transition">Clear Cache</button>
              <button id="clearDevicesBtn" class="px-4 py-2 bg-pink-500 text-white rounded hover:bg-pink-600 transition">Clear Devices</button>
              <button id="resetSystemBtn" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 transition">Reset System</button>
            </div>
            <div id="systemContent">
              <!-- System content will be loaded here -->
            </div>
          </div>
        </section>
        
        <!-- Profile Section -->
        <section id="profileSection" class="hidden">
          <div class="max-w-7xl mx-auto">
            <h2 class="text-3xl font-bold text-gray-900 mb-8">Profile</h2>
            <div id="profileContent">
              <!-- Profile content will be loaded here -->
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>
  <!-- Toast Notifications -->
  <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>
  <!-- Scripts -->
  <script type="module" src="js/admin.js"></script>
  <script>
    // Mobile sidebar toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const sidebar = document.getElementById('sidebar');
    if (mobileMenuBtn && sidebar) {
      mobileMenuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('hidden');
        sidebar.classList.toggle('flex');
      });
    }
  </script>
  <!-- Modal Overlay -->
  <div id="modalOverlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 hidden">
    <div class="bg-white rounded-xl shadow-lg max-w-lg w-full p-6 relative">
      <button id="modalClose" class="absolute top-3 right-3 text-gray-400 hover:text-gray-700 focus:outline-none text-2xl" aria-label="Close">&times;</button>
      <h2 id="modalTitle" class="text-xl font-bold text-gray-900 mb-4"></h2>
      <div id="modalBody"></div>
    </div>
  </div>
</body>
</html>
